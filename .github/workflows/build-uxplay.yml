name: Build & Release Custom UxPlay

on:
  push:
    branches:
      - main
    paths:
      - 'patches/**'
      - '.github/workflows/build-uxplay.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'patches/**'
      - '.github/workflows/build-uxplay.yml'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Tạo hoặc cập nhật GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-uxplay:
    name: Build UxPlay (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            asset_name: uxplay-linux-x86_64
          - arch: arm64
            platform: linux/arm64
            asset_name: uxplay-linux-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build UxPlay inside Debian container
        run: |
          mkdir -p dist
          docker run --rm \
            --platform ${{ matrix.platform }} \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            debian:bookworm-slim /bin/bash -c "
              set -ex
              apt-get update -qq
              apt-get install -y --no-install-recommends \
                cmake build-essential pkg-config git ca-certificates \
                libssl-dev libplist-dev libavahi-compat-libdnssd-dev \
                libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libx11-dev
              
              rm -rf /tmp/uxplay-build
              git clone https://github.com/FDH2/UxPlay.git /tmp/uxplay-build
              cd /tmp/uxplay-build
              git checkout a67e08f6d58e5e1078abb350103e6c6baff67e7e
              git apply /workspace/patches/uxplay_customizations.patch
              mkdir -p build && cd build
              cmake .. -DCMAKE_BUILD_TYPE=Release
              make -j\$(nproc)
              strip uxplay
              cp uxplay /workspace/dist/${{ matrix.asset_name }}
              cd /workspace/dist
              sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
              chmod -R 777 /workspace/dist
            "

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/${{ matrix.asset_name }}
            dist/${{ matrix.asset_name }}.sha256

  release:
    name: Create or Update GitHub Release
    needs: build-uxplay
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-merged
          merge-multiple: true

      - name: List artifacts
        run: |
          ls -la dist-merged/

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            TITLE="WysePlay Release ${TAG_NAME}"
            PRERELEASE="false"
          else
            TAG_NAME="latest"
            TITLE="WysePlay Pre-built Binaries (Latest)"
            PRERELEASE="false"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT

      - name: Publish Release Assets via softprops/action-gh-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_info.outputs.title }}
          draft: false
          prerelease: ${{ steps.release_info.outputs.prerelease == 'true' }}
          files: |
            dist-merged/*
          body: |
            ### WysePlay Pre-built Custom UxPlay Binaries
            
            Các file nhị phân `uxplay` đã được biên dịch tự động bởi GitHub Actions với toàn bộ tính năng và tối ưu hóa độ trễ:
            - **Zero-Latency Mouse Tuning**: Leaky queue buffer=1, TCP_NODELAY, TCP_QUICKACK.
            - **Apple AirPlay Security**: Hỗ trợ mã PIN xác thực OTP và bộ nhớ đệm Whitelist (`/etc/airplay_clients.cache`).
            - **Device Name Display**: Tự động nhận diện và hiển thị tên thiết bị Apple kết nối trên màn hình PIN.
            
            #### Tải xuống:
            - `uxplay-linux-arm64`: Dành cho TV Box X96Q, Orange Pi, Raspberry Pi (64-bit).
            - `uxplay-linux-x86_64`: Dành cho Dell Wyse Thin Client, HP, PC x86_64, VM.
